#
# NecroBrowser configuration
#
version = 1.0

debug = true

# Mark this as true if Necrobrowser is running as root or in test environments
# NOTE: you should have a good reason to run it as root, beware of the yolo --no-sandbox --disable-setuid-sandbox
root = false

# Skip TLS certificate verification when connecting to targets.
# Enable this only for controlled local test targets.
ignoreHTTPSErrors = false

[platform]
    # supported platforms: freebsd, linux, darwin
    type = "linux"

    # The full path to Chromium or Chrome executable
    # Leave empty to use Puppeteer's bundled Chromium
    puppetPath = ""

    # NOTE puppetPath is needed only on FreeBSD
    # make sure you have the Chromium binary
    # as /usr/bin/chromium-browser and when installing puppeteer
    # prefix it with PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true

    extrusionPath = "./extrusion"

    # this is where all task profiles are kept, like:
    # ./profiles/vOkg6KfnP
    profilesPath = "./profiles"

    # listening address and port for the API
    host  = "127.0.0.1"
    port  = 3000

[database]
    # Local SQLite database. Contains session cookies and task results.
    path = "./necro.db"

[api]
    # Local deployment: HTTP and private-network targets are enabled by default.
    readOnlySmoke = false
    allowPrivateNetworks = true
    allowHttp = true
    requestsPerMinute = 60
    burst = 20

[cluster]
    # supported concurrency: browser, page, necro
    # the safest is to run each task in its own browser
    # but in cases where you prefer opening a single browser
    # and tasks in their own incognito tab, use page
    # necro mode uses persistent user data directories
    concurrency = "necro"

    # how many sessions to process simultaneously
    # for max performances: number or cores / 2
    poolSize = 2

    # after how many seconds is the task timing out
    # 2 minutes are usually enough for long-term tasks
    # increase this if your tasks are really long running
    taskTimeout = 360

    # page options
    [cluster.page]
        # browser window size
        windowSize = "1600,1200"

        # page scale factor (zoom level)
        # 1.5 == 150% useful when using headless=false and large screen resolutions above 2K
        scaleFactor = 1

[necro]
    # non-headless means normal chromium GUI
    # in production, and in general unless you encouter headless bugs, you
    # should always use headless = true
    headless = false

    # submitted task metadata and cookies are kept in local SQLite, so sessions
    # can stay alive by loading each task's fixSession URL
    # by default sessions are kept alive every 5 minutes
    [necro.keepalive]
        enabled = true
        delay = 300

    # if you need to upstream proxy the instrumented browsers, here you define it
    # NOTE: consider using a VPN tunnel like Wireguard or IPSEC to tunnel the necrobrowser
    # traffic back into the Muraena reverse proxy machine (if phishing is your usecase)
    [necro.proxy]
        enabled = false
        url = "http://localhost:9999"

    # Optional Cloakbrowser launcher for authorized lab/CTF targets.
    # Install with: npm install cloakbrowser puppeteer-core
    # Cloakbrowser resolves its own Chromium binary; platform.puppetPath
    # continues to control stock Puppeteer mode only.
    [necro.cloak]
        enabled = true
        humanize = true
        # Optional wrapper settings: licenseKey, browserVersion, releaseChannel,
        # locale, timezone, humanPreset, humanConfig, stealthArgs, geoip.
